<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta
 name="viewport"
 content="width=device-width,initial-scale=1"
>

<title>Localhost Runner</title>

<link
 rel="stylesheet"
 href="https://cdn.jsdelivr.net/npm/@xterm/xterm/css/xterm.css"
>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #101216;
    color: #eee;
    font-family: system-ui, sans-serif;
}

main {
    width: min(1200px, 96%);
    margin: auto;
    padding: 25px 0;
}

.card {
    background: #1b1e24;
    padding: 16px;
    margin-bottom: 15px;
    border-radius: 10px;
}

input, button {
    padding: 10px;
    border: 1px solid #454b58;
    border-radius: 6px;
    background: #262a33;
    color: white;
}

button {
    cursor: pointer;
}

.auth,
.controls {
    display: flex;
    gap: 8px;
}

.auth input {
    flex: 1;
}

#command {
    flex: 1;
}

#port {
    width: 100px;
}

#drop {
    padding: 40px;
    border: 2px dashed #566071;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
}

#drop.drag {
    background: #192b3d;
    border-color: #4da3ff;
}

#terminal {
    height: 300px;
    background: black;
    padding: 8px;
}

iframe {
    width: 100%;
    height: 600px;
    border: 0;
    background: white;
}

#status {
    margin-top: 8px;
    color: #aaa;
}

</style>

</head>

<body>

<main>

<h1>Localhost Runner</h1>

<div class="card">

<div class="auth">

<input
 id="username"
 value="admin"
 placeholder="Username"
>

<input
 id="password"
 type="password"
 placeholder="Password"
>

<button onclick="connect()">
Connect
</button>

</div>

<div id="status">
Disconnected
</div>

</div>


<div class="card">

<div id="drop">

📁 Drop project folder here

<br>

<small>
or click to select
</small>

</div>

<input
 id="picker"
 type="file"
 webkitdirectory
 multiple
 hidden
>

</div>


<div class="card">

<div class="controls">

<input
 id="command"
 value="python -m http.server 8000 --bind 127.0.0.1"
>

<input
 id="port"
 type="number"
 value="8000"
>

<button onclick="run()">
▶ Run
</button>

<button onclick="stop()">
■ Stop
</button>

<button onclick="preview()">
🌐 Preview
</button>

</div>

</div>


<div class="card">

<div id="terminal"></div>

</div>


<div class="card">

<h3>Preview</h3>

<iframe
 id="preview"
 sandbox="allow-scripts allow-forms allow-modals allow-popups allow-same-origin"
></iframe>

</div>

</main>


<script
 src="https://cdn.jsdelivr.net/npm/@xterm/xterm/lib/xterm.js">
</script>


<script>

const term = new Terminal({
    cursorBlink: true,
    convertEol: true,
    fontSize: 14
});

term.open(
    document.getElementById("terminal")
);

let ws = null;
let connected = false;


function send(data) {

    if (!ws || ws.readyState !== WebSocket.OPEN) {

        term.writeln(
            "\r\nNot connected."
        );

        return;
    }

    ws.send(
        JSON.stringify(data)
    );
}


function connect() {

    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";

    ws = new WebSocket(
        protocol +
        "//" +
        location.host +
        "/terminal"
    );

    document.getElementById(
        "status"
    ).textContent = "Connecting...";


    ws.onopen = () => {

        send({

            type: "auth",

            username:
                document.getElementById(
                    "username"
                ).value,

            password:
                document.getElementById(
                    "password"
                ).value

        });

    };


    ws.onmessage = event => {

        const message =
            JSON.parse(event.data);


        if (message.type === "ready") {

            connected = true;

            document.getElementById(
                "status"
            ).textContent = "Connected";

            term.write(message.data);

        }


        if (message.type === "output") {

            term.write(message.data);

        }


        if (message.type === "error") {

            term.writeln(
                "\r\nERROR: " +
                message.data
            );

        }

    };


    ws.onclose = () => {

        connected = false;

        document.getElementById(
            "status"
        ).textContent = "Disconnected";

    };

}


async function upload(files) {

    if (!connected) {

        term.writeln(
            "\r\nConnect first."
        );

        return;
    }


    const output = [];


    for (const file of files) {

        const buffer =
            await file.arrayBuffer();

        const bytes =
            new Uint8Array(buffer);

        let binary = "";


        for (
            let i = 0;
            i < bytes.length;
            i++
        ) {

            binary +=
                String.fromCharCode(
                    bytes[i]
                );

        }


        output.push({

            path:
                file.webkitRelativePath
                || file.name,

            data:
                btoa(binary)

        });

    }


    send({

        type: "upload",
        files: output

    });

}


function run() {

    send({

        type: "run",

        command:
            document.getElementById(
                "command"
            ).value,

        port:
            Number(
                document.getElementById(
                    "port"
                ).value
            )

    });

}


function stop() {

    send({
        type: "stop"
    });

}


function preview() {

    const frame =
        document.getElementById(
            "preview"
        );

    frame.src =
        "/preview/?t=" +
        Date.now();

}


const drop =
    document.getElementById("drop");

const picker =
    document.getElementById("picker");


drop.onclick = () =>
    picker.click();


picker.onchange = () =>
    upload(picker.files);


drop.ondragover = event => {

    event.preventDefault();

    drop.classList.add("drag");

};


drop.ondragleave = () => {

    drop.classList.remove("drag");

};


drop.ondrop = event => {

    event.preventDefault();

    drop.classList.remove("drag");

    upload(
        event.dataTransfer.files
    );

};

</script>

</body>

</html>
